name: Public Preview Deploy

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Public Preview API domain. Overrides repository variable PETACCESS_PREVIEW_DOMAIN."
        required: false
        type: string
      require_real_map:
        description: "Require real Tencent map readiness before building the standalone Phone Preview"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: public-preview-deploy
  cancel-in-progress: false

jobs:
  readiness:
    name: Public Preview · deployment readiness
    runs-on: ubuntu-latest
    environment: petaccess-public-preview
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      status: ${{ steps.readiness.outputs.status }}
      domain: ${{ steps.readiness.outputs.domain }}
      api_base: ${{ steps.readiness.outputs.api_base }}
    env:
      INPUT_DOMAIN: ${{ inputs.domain }}
      CONFIGURED_DOMAIN: ${{ vars.PETACCESS_PREVIEW_DOMAIN }}
      SSH_HOST: ${{ secrets.PETACCESS_PREVIEW_SSH_HOST }}
      SSH_USER: ${{ secrets.PETACCESS_PREVIEW_SSH_USER }}
      SSH_KEY: ${{ secrets.PETACCESS_PREVIEW_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PETACCESS_PREVIEW_SSH_KNOWN_HOSTS }}
      POSTGRES_PASSWORD: ${{ secrets.PETACCESS_PREVIEW_POSTGRES_PASSWORD }}
      S3_ACCESS_KEY: ${{ secrets.PETACCESS_PREVIEW_S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.PETACCESS_PREVIEW_S3_SECRET_KEY }}
      JWT_SECRET: ${{ secrets.PETACCESS_PREVIEW_JWT_SECRET }}
    steps:
      - name: Resolve deployment readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail

          DOMAIN="${INPUT_DOMAIN:-${CONFIGURED_DOMAIN:-}}"
          STATUS="READY"
          READY="true"

          if [ -z "$DOMAIN" ]; then
            STATUS="BLOCKED_BY_DOMAIN"
            READY="false"
          elif [[ "$DOMAIN" == *"example.com"* || "$DOMAIN" == *"example.invalid"* ]]; then
            STATUS="BLOCKED_BY_DOMAIN"
            READY="false"
          elif [[ "$DOMAIN" == http://* || "$DOMAIN" == https://* || "$DOMAIN" == */* ]]; then
            echo "domain must be a hostname only, without scheme or path" >&2
            exit 64
          fi

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            STATUS="BLOCKED_BY_SSH"
            READY="false"
          elif [ -z "$SSH_KNOWN_HOSTS" ]; then
            STATUS="BLOCKED_BY_SSH_TRUST"
            READY="false"
          fi

          if [ -z "$POSTGRES_PASSWORD" ] || [ -z "$S3_ACCESS_KEY" ] || \
             [ -z "$S3_SECRET_KEY" ] || [ -z "$JWT_SECRET" ]; then
            STATUS="BLOCKED_BY_SECRETS"
            READY="false"
          fi

          API_BASE=""
          if [ -n "$DOMAIN" ]; then
            API_BASE="https://$DOMAIN/api/v1"
          fi

          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "api_base=$API_BASE" >> "$GITHUB_OUTPUT"

          {
            echo "## Public Preview deployment readiness"
            echo
            echo "- Status: **$STATUS**"
            echo "- Domain: ${DOMAIN:-not configured}"
            echo "- API: ${API_BASE:-not configured}"
            echo "- Deployment eligible: $READY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write machine-readable readiness
        shell: bash
        env:
          READY: ${{ steps.readiness.outputs.ready }}
          STATUS: ${{ steps.readiness.outputs.status }}
          DOMAIN: ${{ steps.readiness.outputs.domain }}
          API_BASE: ${{ steps.readiness.outputs.api_base }}
        run: |
          python - <<'PY'
          import json
          import os

          payload = {
              "schemaVersion": 1,
              "product": "PetAccess",
              "artifactKind": "public-preview-deploy-readiness",
              "commit": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "status": os.environ["STATUS"],
              "deploymentEligible": os.environ["READY"] == "true",
              "domain": os.environ["DOMAIN"] or None,
              "apiBase": os.environ["API_BASE"] or None,
          }
          with open("PUBLIC_PREVIEW_DEPLOY_READINESS.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: petaccess-public-preview-deploy-readiness-${{ github.sha }}
          path: PUBLIC_PREVIEW_DEPLOY_READINESS.json
          if-no-files-found: error
          retention-days: 14

  blocked:
    name: Public Preview · external blocker
    needs: readiness
    if: needs.readiness.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Preserve explicit blocker
        shell: bash
        run: |
          echo "Public Preview deployment not attempted."
          echo "Status: ${{ needs.readiness.outputs.status }}"
          echo "No fake host, tunnel, localhost endpoint, or static fixture backend will be substituted."

  deploy:
    name: Public Preview · deploy + preflight + Phone Preview dispatch
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: petaccess-public-preview
    env:
      DOMAIN: ${{ needs.readiness.outputs.domain }}
      API_BASE: ${{ needs.readiness.outputs.api_base }}
      SSH_HOST: ${{ secrets.PETACCESS_PREVIEW_SSH_HOST }}
      SSH_USER: ${{ secrets.PETACCESS_PREVIEW_SSH_USER }}
      SSH_PORT: ${{ vars.PETACCESS_PREVIEW_SSH_PORT || '22' }}
      REMOTE_ROOT: ${{ vars.PETACCESS_PREVIEW_REMOTE_ROOT || 'petaccess-public-preview' }}
      POSTGRES_DB: ${{ vars.PETACCESS_PREVIEW_POSTGRES_DB || 'petaccess_preview' }}
      POSTGRES_USER: ${{ vars.PETACCESS_PREVIEW_POSTGRES_USER || 'petaccess' }}
      POSTGRES_PASSWORD: ${{ secrets.PETACCESS_PREVIEW_POSTGRES_PASSWORD }}
      S3_ACCESS_KEY: ${{ secrets.PETACCESS_PREVIEW_S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.PETACCESS_PREVIEW_S3_SECRET_KEY }}
      S3_BUCKET: ${{ vars.PETACCESS_PREVIEW_S3_BUCKET || 'petaccess-preview' }}
      JWT_SECRET: ${{ secrets.PETACCESS_PREVIEW_JWT_SECRET }}
      MAP_PROVIDER: ${{ vars.PETACCESS_PREVIEW_MAP_PROVIDER || 'mock' }}
      FEATURE_REAL_MAP: ${{ vars.PETACCESS_PREVIEW_FEATURE_REAL_MAP || 'false' }}
      TENCENT_MAP_KEY_CLIENT: ${{ secrets.PETACCESS_PREVIEW_TENCENT_MAP_KEY_CLIENT }}
      TENCENT_MAP_KEY_SERVER: ${{ secrets.PETACCESS_PREVIEW_TENCENT_MAP_KEY_SERVER }}
      REQUIRE_REAL_MAP: ${{ inputs.require_real_map && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend tooling for public API preflight
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PETACCESS_PREVIEW_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PETACCESS_PREVIEW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/petaccess_preview
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/petaccess_preview ~/.ssh/known_hosts

          ssh -i ~/.ssh/petaccess_preview \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'printf "PETACCESS_PREVIEW_SSH_TRUST=PASS\\n"'

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          case "$POSTGRES_PASSWORD$S3_SECRET_KEY$JWT_SECRET" in
            *CHANGE_ME*|*change_me*)
              echo "Preview secrets still contain CHANGE_ME placeholders" >&2
              exit 64
              ;;
          esac

          if [ "$REQUIRE_REAL_MAP" = "1" ]; then
            if [ "$FEATURE_REAL_MAP" != "true" ] || [ "$MAP_PROVIDER" != "tencent" ]; then
              echo "require_real_map=true requires MAP_PROVIDER=tencent and FEATURE_REAL_MAP=true" >&2
              exit 64
            fi
            test -n "$TENCENT_MAP_KEY_CLIENT"
            test -n "$TENCENT_MAP_KEY_SERVER"
          fi

          case "$REMOTE_ROOT" in
            *[!A-Za-z0-9_./-]*|*".."*)
              echo "PETACCESS_PREVIEW_REMOTE_ROOT contains unsafe path characters" >&2
              exit 64
              ;;
          esac

          APP_ENV=staging \
          API_BASE_URL="$API_BASE" \
          PETACCESS_PREVIEW_DOMAIN="$DOMAIN" \
          DATABASE_URL="postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB" \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          S3_ACCESS_KEY="$S3_ACCESS_KEY" \
          S3_SECRET_KEY="$S3_SECRET_KEY" \
          JWT_SECRET="$JWT_SECRET" \
          FEATURE_REAL_MAP="$FEATURE_REAL_MAP" \
          TENCENT_MAP_KEY_CLIENT="$TENCENT_MAP_KEY_CLIENT" \
          TENCENT_MAP_KEY_SERVER="$TENCENT_MAP_KEY_SERVER" \
            sh infra/deploy/preview/preview-env-check.sh

      - name: Resolve absolute remote deployment root
        shell: bash
        run: |
          set -euo pipefail
          ABS_ROOT="$(
            ssh -i ~/.ssh/petaccess_preview \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              "mkdir -p '$REMOTE_ROOT/releases' '$REMOTE_ROOT/shared' && cd '$REMOTE_ROOT' && pwd"
          )"
          test -n "$ABS_ROOT"
          echo "REMOTE_ROOT_ABS=$ABS_ROOT" >> "$GITHUB_ENV"
      - name: Build deployment environment file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/.env.preview" <<EOF
          PETACCESS_PREVIEW_DOMAIN=$DOMAIN
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB
          REDIS_URL=redis://redis:6379/0
          CELERY_TASK_QUEUE=petaccess_preview
          S3_ACCESS_KEY=$S3_ACCESS_KEY
          S3_SECRET_KEY=$S3_SECRET_KEY
          S3_BUCKET=$S3_BUCKET
          S3_REGION=us-east-1
          JWT_SECRET=$JWT_SECRET
          MAP_PROVIDER=$MAP_PROVIDER
          FEATURE_REAL_MAP=$FEATURE_REAL_MAP
          TENCENT_MAP_KEY_CLIENT=$TENCENT_MAP_KEY_CLIENT
          TENCENT_MAP_KEY_SERVER=$TENCENT_MAP_KEY_SERVER
          AI_PROVIDER=mock
          VISION_PROVIDER=mock
          OCR_PROVIDER=mock
          FEATURE_REAL_AI=false
          AI_API_KEY=
          NOTIFICATION_PROVIDER=mock
          PETACCESS_IMAGE_TAG=$GITHUB_SHA
          EOF

      - name: Upload immutable release directory
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$REMOTE_ROOT_ABS/releases/$GITHUB_SHA"
          SHARED_ENV="$REMOTE_ROOT_ABS/shared/.env.preview"
          SSH=(ssh -i ~/.ssh/petaccess_preview -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST")
          SCP=(scp -i ~/.ssh/petaccess_preview -P "$SSH_PORT" -o StrictHostKeyChecking=yes)

          "${SSH[@]}" "mkdir -p '$RELEASE_DIR' '$REMOTE_ROOT_ABS/shared'"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.venv \
            --exclude=artifacts \
            --exclude='infra/deploy/preview/.env.preview' \
            -czf - . \
            | "${SSH[@]}" "tar -xzf - -C '$RELEASE_DIR'"

          "${SCP[@]}" "$RUNNER_TEMP/.env.preview" "$SSH_USER@$SSH_HOST:$SHARED_ENV"
          "${SSH[@]}" "chmod 600 '$SHARED_ENV'"

      - name: Deploy Preview stack
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$REMOTE_ROOT_ABS/releases/$GITHUB_SHA"
          SHARED_ENV="$REMOTE_ROOT_ABS/shared/.env.preview"

          ssh -i ~/.ssh/petaccess_preview \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -eu
             cd '$RELEASE_DIR'
             docker compose \
               --env-file '$SHARED_ENV' \
               -f infra/deploy/preview/compose.yaml \
               up -d --build --remove-orphans
             docker compose \
               --env-file '$SHARED_ENV' \
               -f infra/deploy/preview/compose.yaml \
               ps"

      - name: Verify public HTTPS identity
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS "https://$DOMAIN/health" >/dev/null 2>&1 && \
               curl -fsS "https://$DOMAIN/health/ready" >/dev/null 2>&1 && \
               curl -fsS "https://$DOMAIN/api/v1/ping" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Public Preview HTTPS endpoint did not become ready" >&2
              exit 1
            fi
            sleep 5
          done

          PETACCESS_PUBLIC_API_BASE="$API_BASE" \
          PETACCESS_REQUIRE_REAL_MAP="$REQUIRE_REAL_MAP" \
            node scripts/release/verify_public_api.cjs

      - name: Mark verified release current
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$REMOTE_ROOT_ABS/releases/$GITHUB_SHA"
          ssh -i ~/.ssh/petaccess_preview \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "ln -sfn '$RELEASE_DIR' '$REMOTE_ROOT_ABS/current'"

      - name: Write deployment record
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          payload = {
              "schemaVersion": 1,
              "product": "PetAccess",
              "artifactKind": "public-preview-deployment",
              "commit": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "status": "DEPLOYED_AND_PREFLIGHTED",
              "domain": os.environ["DOMAIN"],
              "apiBase": os.environ["API_BASE"],
              "requireRealMap": os.environ["REQUIRE_REAL_MAP"] == "1",
              "phonePreviewDispatchRequested": True,
          }
          with open("PUBLIC_PREVIEW_DEPLOYMENT.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: petaccess-public-preview-deployment-${{ github.sha }}
          path: PUBLIC_PREVIEW_DEPLOYMENT.json
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch standalone Phone Preview
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run android-phone-preview.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f api_base="$API_BASE" \
            -f require_real_map="${{ inputs.require_real_map }}"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## PetAccess Public Preview deployed"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- API: $API_BASE"
            echo "- HTTPS preflight: PASS"
            echo "- Real map required: $REQUIRE_REAL_MAP"
            echo "- Android Phone Preview: workflow_dispatch requested"
            echo
            echo "The deployment is Preview/Staging only; this does not authorize Production or Release."
          } >> "$GITHUB_STEP_SUMMARY"
