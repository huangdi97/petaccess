name: UI Direct Validation

on:
  push:
    branches:
      - feat/ui-direct-craft-v8
  pull_request:
    branches:
      - feat/ui-product-craft-v7-human-review-final

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: UI lint, typecheck and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint:fe
      - name: Apply canonical Prettier formatting
        run: pnpm exec prettier --write "apps/client-h5/src/**/*.{vue,ts}" "apps/admin/src/**/*.{vue,ts}" "docs/ui/contracts/json/*.json" "tests/ui-oracle/*.ts" "tests/e2e/consumer-contract-closure.spec.ts" "tests/e2e/contribute-wizard.spec.ts"
      - name: Commit formatting on direct branch pushes
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client-h5/src apps/admin/src docs/ui/contracts/json tests/ui-oracle tests/e2e/consumer-contract-closure.spec.ts tests/e2e/contribute-wizard.spec.ts
          git commit -m "style(ui): apply canonical Prettier formatting"
          git push origin HEAD:feat/ui-direct-craft-v8
      - name: Prettier check
        run: pnpm format:check:fe
      - name: client-h5 typecheck + build
        run: pnpm --filter @petaccess/client-h5 build
      - name: admin typecheck + build
        run: pnpm --filter @petaccess/admin build
