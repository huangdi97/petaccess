name: Android Phone Preview APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Phone-reachable PetAccess API base, e.g. https://staging.example.com/api/v1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-phone-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  phone-preview:
    name: Android Preview · ARM64 standalone API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_TAURI_ANDROID_API_BASE: ${{ inputs.api_base }}
      VITE_APP_VERSION: phone-preview-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate API URL and generate isolated Preview CSP
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const raw = (process.env.VITE_TAURI_ANDROID_API_BASE ?? "").trim();
          if (!raw) {
            console.error("api_base is required");
            process.exit(1);
          }

          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error("api_base must be an absolute URL");
            process.exit(1);
          }

          if (url.protocol !== "https:") {
            console.error(
              "Phone Preview requires an HTTPS API. Use the USB Preview + adb reverse path for local HTTP development.",
            );
            process.exit(1);
          }
          if (url.username || url.password) {
            console.error("api_base must not embed credentials");
            process.exit(1);
          }
          if (url.search || url.hash) {
            console.error("api_base must not contain query parameters or fragments");
            process.exit(1);
          }

          const origin = url.origin;
          const baseConfig = {
            productName: "PetAccess Preview",
            identifier: "com.petaccess.map.preview",
            app: {
              security: {
                csp: [
                  "default-src 'self'",
                  "connect-src 'self' ipc: http://ipc.localhost https://apis.map.qq.com https://map.qq.com https://mapapi.qq.com https://*.map.qq.com https://*.map.gtimg.com " + origin,
                  "img-src 'self' asset: http://asset.localhost data: blob: https://map.qq.com https://mapapi.qq.com https://*.map.qq.com https://*.map.gtimg.com " + origin,
                  "style-src 'self' 'unsafe-inline'",
                  "font-src 'self' data:",
                  "script-src 'self' https://map.qq.com https://mapapi.qq.com",
                  "worker-src 'self' blob:",
                ].join("; "),
              },
            },
            bundle: {
              android: {
                debugApplicationIdSuffix: null,
              },
            },
          };

          const target = path.join(
            "apps",
            "client-h5",
            "src-tauri",
            "tauri.phone-preview.generated.json",
          );
          fs.writeFileSync(target, JSON.stringify(baseConfig, null, 2) + "\n");

          fs.writeFileSync(
            "PHONE_PREVIEW_METADATA.txt",
            [
              "PetAccess Android Phone Preview",
              "commit=" + process.env.GITHUB_SHA,
              "branch=" + process.env.GITHUB_REF_NAME,
              "api_base=" + raw,
              "api_origin=" + origin,
              "api_transport=" + url.protocol.replace(":", ""),
              "package=com.petaccess.map.preview",
              "architecture=arm64-v8a",
              "build=debug",
              "release_signature=NO",
              "store_release_artifact=NO",
              "requires_adb_reverse=NO",
              "",
              "This artifact is a manually configured Preview build, not a production Release.",
            ].join("\n"),
          );
          NODE

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGMT="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMGMT="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "sdkmanager not found in $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMGMT" --licenses >/dev/null 2>&1 || true
          "$SDKMGMT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          echo "NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/client-h5/src-tauri/target
          key: android-phone-preview-aarch64-${{ hashFiles('apps/client-h5/src-tauri/Cargo.lock') }}

      - name: Initialize isolated Phone Preview Android project
        run: >-
          pnpm --filter @petaccess/client-h5 exec tauri android init
          --ci
          --config src-tauri/tauri.phone-preview.generated.json

      - name: Build ARM64 Phone Preview APK
        run: >-
          pnpm --filter @petaccess/client-h5 exec tauri android build
          --debug
          --apk
          --target aarch64
          --config src-tauri/tauri.phone-preview.generated.json
          --ci

      - name: Verify endpoint and APK identity
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -R --binary-files=text --fixed-strings             "$VITE_TAURI_ANDROID_API_BASE" apps/client-h5/dist >/dev/null; then
            echo "Configured phone API endpoint is missing from the Consumer bundle"
            exit 1
          fi

          mapfile -t APKS < <(
            find apps/client-h5/src-tauri/gen/android               -type f               -name "*debug*.apk"               ! -path "*/androidTest/*"               -print
          )
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK, found ${#APKS[@]}"
            find apps/client-h5/src-tauri/gen/android -type f -name "*.apk" -print || true
            exit 1
          fi

          APK="${APKS[0]}"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" > PHONE_PREVIEW_SIGNER_CERTS.txt
          "$AAPT" dump badging "$APK" > PHONE_PREVIEW_BADGING.txt

          grep -Fq "package: name='com.petaccess.map.preview'" PHONE_PREVIEW_BADGING.txt
          grep -Fq "application-label:'PetAccess Preview'" PHONE_PREVIEW_BADGING.txt
          grep -Fq "'arm64-v8a'" PHONE_PREVIEW_BADGING.txt

          SHORT_SHA="${GITHUB_SHA::8}"
          OUT="PetAccess-phone-preview-${SHORT_SHA}-arm64-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > PHONE_PREVIEW_SHA256.txt
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload Phone Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: petaccess-phone-preview-${{ steps.apk.outputs.short_sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ steps.apk.outputs.path }}
            PHONE_PREVIEW_METADATA.txt
            PHONE_PREVIEW_BADGING.txt
            PHONE_PREVIEW_SIGNER_CERTS.txt
            PHONE_PREVIEW_SHA256.txt

      - name: Preview summary
        shell: bash
        run: |
          {
            echo "## PetAccess Android Phone Preview"
            echo
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Package: `com.petaccess.map.preview`"
            echo "- ABI: `arm64-v8a`"
            echo "- API: `$VITE_TAURI_ANDROID_API_BASE`"
            echo "- Requires adb reverse: no"
            echo "- Debug Preview only; never a signed/store Release."
          } >> "$GITHUB_STEP_SUMMARY"
