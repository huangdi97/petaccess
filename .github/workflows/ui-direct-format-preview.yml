name: UI Direct Format Preview

permissions:
  contents: write

on:
  push:
    branches:
      - feat/ui-direct-craft-v8

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format targets
        run: |
          pnpm exec prettier --write \
            apps/client-h5/src/views/HomeView.vue \
            apps/client-h5/src/views/ContributeView.vue \
            apps/client-h5/src/views/MineView.vue \
            apps/client-h5/src/views/NotificationsView.vue \
            apps/client-h5/src/views/OperatorClaimView.vue \
            apps/client-h5/src/composables/useNotificationsCenter.ts \
            apps/client-h5/src/components/mine/MinePublicState.vue \
            apps/client-h5/src/components/contribute/ContributeRealityForm.vue \
            apps/client-h5/src/components/contribute/ContributeRuleForm.vue \
            apps/client-h5/src/components/contribute/RuleLeadFields.vue \
            apps/client-h5/src/components/contribute/ContributionReview.vue \
            apps/client-h5/src/components/contribute/RuleEvidenceUpload.vue \
            apps/client-h5/src/components/contribute/RuleTargetPicker.vue \
            apps/client-h5/src/components/operator/OperatorClaimForm.vue \
            apps/client-h5/src/components/domain/DecisionInspector.vue \
            apps/client-h5/src/components/domain/MapResultPane.vue \
            apps/client-h5/src/components/domain/PlaceResultRow.vue \
            apps/client-h5/src/components/domain/PlaceSceneFrame.vue \
            apps/client-h5/src/components/domain/PlacePreview.vue \
            apps/client-h5/src/components/map/MapSelectedSheet.vue \
            apps/client-h5/src/components/MockMap.vue \
            apps/client-h5/src/styles/consumer-discovery-v11.css \
            apps/client-h5/src/components/place/PlaceRulesPane.vue \
            apps/client-h5/src/components/place/PlaceOverviewPane.vue \
            apps/client-h5/src/composables/useHomeLauncher.ts \
            apps/client-h5/src/composables/useRuleLeadContribution.ts \
            apps/client-h5/src/composables/useMapWorkspace.ts \
            apps/client-h5/src/consumer/homeDigest.ts \
            apps/client-h5/src/consumer/mapLens.ts \
            apps/client-h5/src/views/PlaceView.vue \
            apps/client-h5/src/views/RealityTraceView.vue \
            docs/ui/contracts/json/evidence.json \
            docs/ui/contracts/json/place.desktop.json \
            docs/ui/contracts/json/place.mobile.json \
            tests/e2e/place-route-race.spec.ts \
            tests/e2e/public-private-session-boundary.spec.ts \
            tests/e2e/contribute-wizard.spec.ts \
            tests/e2e/boundary-preferences.spec.ts \
            tests/e2e/responsive.spec.ts \
            tests/e2e/consumer-contract-closure.spec.ts \
            tests/e2e/accessibility-contract.spec.ts \
            tests/ui-oracle/human-review-direct-v8.spec.ts \
            scripts/android_acceptance/cdp_probe.cjs \
            scripts/android_acceptance/cdp_journey.cjs \
            scripts/android_acceptance/ime_gate.cjs \
            scripts/windows_acceptance/cdp_shell_smoke.cjs \
            scripts/release/verify_public_api.cjs \
            .github/workflows/android-preview.yml \
            .github/workflows/android-phone-preview.yml \
            .github/workflows/public-preview-deploy.yml
      - name: Show Android Preview workflow format diff
        shell: bash
        run: git diff -- .github/workflows/android-preview.yml .github/workflows/android-phone-preview.yml

      # One-shot branch repair: Format Preview already defines the canonical
      # Prettier target set. Commit only tracked formatting drift, never
      # generated artifacts. A GITHUB_TOKEN push does not recursively trigger
      # another workflow run; this step will be removed after the repair.
      - name: Commit canonical formatting drift
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply canonical UI formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: ui-direct-formatted-targets
          path: |
            apps/client-h5/src/views/HomeView.vue
            apps/client-h5/src/views/ContributeView.vue
            apps/client-h5/src/views/MineView.vue
            apps/client-h5/src/views/NotificationsView.vue
            apps/client-h5/src/views/OperatorClaimView.vue
            apps/client-h5/src/composables/useNotificationsCenter.ts
            apps/client-h5/src/components/mine/MinePublicState.vue
            apps/client-h5/src/components/contribute/ContributeRealityForm.vue
            apps/client-h5/src/components/contribute/ContributeRuleForm.vue
            apps/client-h5/src/components/contribute/RuleLeadFields.vue
            apps/client-h5/src/components/contribute/ContributionReview.vue
            apps/client-h5/src/components/contribute/RuleEvidenceUpload.vue
            apps/client-h5/src/components/contribute/RuleTargetPicker.vue
            apps/client-h5/src/components/operator/OperatorClaimForm.vue
            apps/client-h5/src/components/domain/DecisionInspector.vue
            apps/client-h5/src/components/domain/MapResultPane.vue
            apps/client-h5/src/components/domain/PlaceResultRow.vue
            apps/client-h5/src/components/domain/PlaceSceneFrame.vue
            apps/client-h5/src/components/domain/PlacePreview.vue
            apps/client-h5/src/components/map/MapSelectedSheet.vue
            apps/client-h5/src/components/MockMap.vue
            apps/client-h5/src/styles/consumer-discovery-v11.css
            apps/client-h5/src/components/place/PlaceRulesPane.vue
            apps/client-h5/src/components/place/PlaceOverviewPane.vue
            apps/client-h5/src/composables/useHomeLauncher.ts
            apps/client-h5/src/composables/useRuleLeadContribution.ts
            apps/client-h5/src/composables/useMapWorkspace.ts
            apps/client-h5/src/consumer/homeDigest.ts
            apps/client-h5/src/consumer/mapLens.ts
            apps/client-h5/src/views/PlaceView.vue
            apps/client-h5/src/views/RealityTraceView.vue
            docs/ui/contracts/json/evidence.json
            docs/ui/contracts/json/place.desktop.json
            docs/ui/contracts/json/place.mobile.json
            tests/e2e/place-route-race.spec.ts
            tests/e2e/public-private-session-boundary.spec.ts
            tests/e2e/contribute-wizard.spec.ts
            tests/e2e/boundary-preferences.spec.ts
            tests/e2e/responsive.spec.ts
            tests/e2e/consumer-contract-closure.spec.ts
            tests/e2e/accessibility-contract.spec.ts
            tests/ui-oracle/human-review-direct-v8.spec.ts
            scripts/android_acceptance/cdp_probe.cjs
            scripts/android_acceptance/cdp_journey.cjs
            scripts/android_acceptance/ime_gate.cjs
            scripts/windows_acceptance/cdp_shell_smoke.cjs
            scripts/release/verify_public_api.cjs
            .github/workflows/android-preview.yml
            .github/workflows/android-phone-preview.yml
            .github/workflows/public-preview-deploy.yml
