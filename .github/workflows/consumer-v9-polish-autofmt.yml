name: Consumer V9 Polish Autofmt

on:
  push:
    branches:
      - feat/ui-direct-craft-v8
    paths:
      - .github/workflows/consumer-v9-polish-autofmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-direct-craft-v8
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Consumer v9 polish
        run: |
          pnpm exec prettier --write \
            apps/client-h5/src/styles/consumer-discovery-v9.css \
            docs/ui/contracts/json/home.json \
            docs/ui/contracts/json/search.desktop.json \
            docs/ui/contracts/json/search.mobile.json \
            docs/ui/contracts/json/place.desktop.json \
            docs/ui/contracts/json/reality.json \
            docs/ui/contracts/json/evidence.json
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client-h5/src/styles/consumer-discovery-v9.css docs/ui/contracts/json
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): format Consumer Discovery v9 polish"
            git push origin HEAD:feat/ui-direct-craft-v8
          fi
