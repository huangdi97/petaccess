name: Branch Autofmt

on:
  push:
    branches:
      - feat/ui-direct-craft-v8

permissions:
  contents: write

jobs:
  autofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-direct-craft-v8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatters
        run: |
          python -m pip install ruff==0.16.6
          npm install --global prettier@3.9.6
      - name: Normalize Python format without suppressing quality checks
        run: |
          ruff check --fix --unsafe-fixes scripts/android_acceptance scripts/isolated_db.py scripts/visual_db_reset.py services/api/app/api/v1/v05.py services/api/app/services/reality_contribution.py || true
          # Keep the formatter's scope identical to the PR format check.
          # This changes whitespace/formatting only; UI visual snapshots stay untouched.
          ruff format services/api services/worker tests scripts
          prettier --write \
            tests/e2e/contribute-wizard.spec.ts \
            tests/e2e/contribute-route-race.spec.ts \
            tests/e2e/h5-journey.spec.ts \
            tests/e2e/place-route-race.spec.ts \
            tools/ui-oracle/build-human-review-board.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api services/worker tests scripts tools/ui-oracle/build-human-review-board.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "chore(autofmt): normalize branch quality files"
            git push origin HEAD:feat/ui-direct-craft-v8
          fi
