name: Branch Autofmt

on:
  push:
    branches:
      - feat/ui-direct-craft-v8

permissions:
  contents: read

jobs:
  autofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-direct-craft-v8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatters
        run: |
          python -m pip install ruff==0.16.6
          npm install --global prettier@3.9.6
      - name: Verify Python and E2E formatting without branch mutation
        run: |
          ruff check scripts/android_acceptance scripts/isolated_db.py scripts/visual_db_reset.py services/api/app/api/v1/v05.py services/api/app/services/reality_contribution.py
          ruff format --check services/api services/worker tests scripts
          prettier --check \
            tests/e2e/contribute-wizard.spec.ts \
            tests/e2e/contribute-route-race.spec.ts \
            tests/e2e/h5-journey.spec.ts \
            tests/e2e/place-route-race.spec.ts \
            tools/ui-oracle/build-human-review-board.mjs
