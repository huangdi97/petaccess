name: Consumer V9 Final CSS Autofmt

on:
  push:
    branches:
      - feat/ui-direct-craft-v8
    paths:
      - .github/workflows/consumer-v9-final-css-autofmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-direct-craft-v8
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final Consumer v9 CSS
        run: pnpm exec prettier --write apps/client-h5/src/styles/consumer-discovery-v9.css
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client-h5/src/styles/consumer-discovery-v9.css
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): format final Consumer Discovery v9 CSS"
            git push origin HEAD:feat/ui-direct-craft-v8
          fi
