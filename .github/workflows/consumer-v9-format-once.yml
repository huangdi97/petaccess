name: Consumer V9 One-Shot Format

on:
  push:
    branches:
      - feat/ui-direct-craft-v8
    paths:
      - .github/workflows/consumer-v9-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-direct-craft-v8
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format precisely the four verified failing Vue files
        run: |
          pnpm exec prettier --write             apps/client-h5/src/views/HomeView.vue             apps/client-h5/src/views/PlaceView.vue             apps/client-h5/src/components/place/PlaceOverviewPane.vue             apps/client-h5/src/components/domain/DecisionInspector.vue
      - name: Commit formatting only if necessary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client-h5/src/views/HomeView.vue apps/client-h5/src/views/PlaceView.vue apps/client-h5/src/components/place/PlaceOverviewPane.vue apps/client-h5/src/components/domain/DecisionInspector.vue
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): apply canonical Prettier formatting to consumer views"
            git push origin HEAD:feat/ui-direct-craft-v8
          fi
