name: Fix Current Formatting Once

on:
  push:
    branches:
      - feat/ui-direct-craft-v8
    paths:
      - .github/workflows/fix-current-formatting-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-direct-craft-v8
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned formatters
        run: |
          python -m pip install ruff==0.16.6
          npm install --global prettier@3.9.6
      - name: Apply repository formatting
        run: |
          ruff format tests/unit/test_scan_secrets.py
          prettier --write apps/client-h5/src/runtime/androidBack.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_scan_secrets.py apps/client-h5/src/runtime/androidBack.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply pinned formatters to current gate failures"
            git push origin HEAD:feat/ui-direct-craft-v8
          fi
