name: UI Direct Visual

on:
  push:
    branches:
      - feat/ui-direct-craft-v8
  pull_request:
    branches:
      - feat/ui-product-craft-v7-human-review-final
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: UI oracle and screenshots
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: petaccess
          POSTGRES_DB: petaccess
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petaccess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://petaccess@localhost:5432/petaccess_visual
      VISUAL_DB_ADMIN_URL: postgresql://petaccess@localhost:5432/postgres
      VISUAL_REDIS_URL: redis://127.0.0.1:6379/2
      UI_ORACLE_STAGE: ui-direct-v8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python deps
        run: uv sync --dev --all-packages

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build H5
        run: pnpm --filter @petaccess/client-h5 build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run UI Oracle and canonical human-review capture
        run: >-
          pnpm exec playwright test
          tests/ui-oracle/oracle.spec.ts
          tests/ui-oracle/secondary-craft.spec.ts
          tests/ui-oracle/human-review-direct-v8.spec.ts
          -c playwright.ui-oracle.config.ts

      - name: Compare UI contracts
        run: node --experimental-strip-types tools/ui-oracle/compare.ts ui-direct-v8

      - name: Upload UI screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-direct-v8-visual
          path: |
            artifacts/blind-ui-recovery/screens/ui-direct-v8/
            artifacts/blind-ui-recovery/probes/ui-direct-v8-*.json
            artifacts/blind-ui-recovery/reports/compare-*.json
            artifacts/ui-direct-secondary/
            artifacts/ui-direct-v8/HUMAN_REVIEW/
          if-no-files-found: warn
