name: Public Preview Stack Validation

on:
  pull_request:
    paths:
      - "infra/deploy/preview/**"
      - "services/api/**"
      - "services/worker/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/preview-stack-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to the PR head and the corresponding pull_request event represent
  # the same candidate. Key both to the head branch so only one heavy Docker
  # stack validation runs for that candidate.
  group: public-preview-stack-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build + boot Preview backend contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PETACCESS_PREVIEW_DOMAIN: preview-ci.test
      POSTGRES_DB: petaccess_preview_ci
      POSTGRES_USER: petaccess
      POSTGRES_PASSWORD: ci_preview_postgres_5dd5f53b1a0c
      DATABASE_URL: postgresql+psycopg://petaccess:ci_preview_postgres_5dd5f53b1a0c@db:5432/petaccess_preview_ci
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_QUEUE: petaccess_preview_ci
      S3_ACCESS_KEY: petaccess-preview-ci
      S3_SECRET_KEY: ci_preview_storage_1877e57d1556
      S3_BUCKET: petaccess-preview-ci
      S3_REGION: us-east-1
      JWT_SECRET: ci_preview_jwt_a81f168ab22e4f9ca0621f685ec809501ec80e7a
      MAP_PROVIDER: mock
      FEATURE_REAL_MAP: "false"
      AI_PROVIDER: mock
      VISION_PROVIDER: mock
      OCR_PROVIDER: mock
      FEATURE_REAL_AI: "false"
      NOTIFICATION_PROVIDER: mock
      PETACCESS_IMAGE_TAG: ci-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Preview environment guard
        shell: bash
        run: |
          set -euo pipefail
          APP_ENV=staging \
          API_BASE_URL="https://$PETACCESS_PREVIEW_DOMAIN/api/v1" \
            sh infra/deploy/preview/preview-env-check.sh

          if APP_ENV=staging \
            PETACCESS_PREVIEW_DOMAIN=example.com \
            API_BASE_URL=https://example.com/api/v1 \
            sh infra/deploy/preview/preview-env-check.sh; then
            echo "Preview env guard accepted a placeholder domain"
            exit 1
          fi

          if APP_ENV=development \
            API_BASE_URL="https://$PETACCESS_PREVIEW_DOMAIN/api/v1" \
            sh infra/deploy/preview/preview-env-check.sh; then
            echo "Preview env guard accepted non-staging APP_ENV"
            exit 1
          fi

      - name: Validate Compose rendering
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -f infra/deploy/preview/compose.yaml \
            config --quiet
          docker compose \
            -f infra/deploy/preview/compose.yaml \
            config > "$RUNNER_TEMP/preview-compose.rendered.yaml"

      - name: Build Preview API image
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -f infra/deploy/preview/compose.yaml \
            build api

      - name: Boot data plane + API + worker
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -f infra/deploy/preview/compose.yaml \
            up -d db redis storage api worker

          for i in $(seq 1 60); do
            if docker compose -f infra/deploy/preview/compose.yaml exec -T api \
              python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).read()' \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          echo "Preview API did not become healthy"
          docker compose -f infra/deploy/preview/compose.yaml ps
          docker compose -f infra/deploy/preview/compose.yaml logs --no-color --tail=200 api worker db redis storage
          exit 1

      - name: Verify migrated API + readiness + identity
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/deploy/preview/compose.yaml exec -T api python - <<'PY'
          import json
          import urllib.request

          def fetch(path: str):
              with urllib.request.urlopen(f"http://127.0.0.1:8000{path}", timeout=5) as response:
                  body = response.read().decode("utf-8")
                  return response.status, json.loads(body)

          health_status, health = fetch("/health")
          ready_status, ready = fetch("/health/ready")
          ping_status, ping = fetch("/api/v1/ping")

          if health_status != 200 or health.get("status") != "ok":
              raise SystemExit(f"bad /health: {health_status} {health}")
          if ready_status != 200:
              raise SystemExit(f"bad /health/ready: {ready_status} {ready}")
          if ping_status != 200 or ping.get("pong") is not True:
              raise SystemExit(f"bad /api/v1/ping: {ping_status} {ping}")

          components = None
          components_status = None
          for _ in range(12):
              components_status, components = fetch("/health/components")
              if components_status == 200 and components.get("all_ok") is True:
                  break
              import time
              time.sleep(1)
          if components_status != 200 or not components or components.get("all_ok") is not True:
              raise SystemExit(
                  f"bad /health/components: {components_status} {components}"
              )

          print(json.dumps({
              "health": health,
              "ready": ready,
              "ping": ping,
              "components": components,
          }, ensure_ascii=False, indent=2))
          PY

          docker compose -f infra/deploy/preview/compose.yaml exec -T api \
            sh -c 'cd /app/services/api && /app/.venv/bin/alembic current'

          WORKER_STATE="$(docker inspect --format '{{.State.Status}}' petaccess-public-preview-worker-1 2>/dev/null || true)"
          if [ "$WORKER_STATE" != "running" ]; then
            echo "Preview worker is not running: $WORKER_STATE"
            docker compose -f infra/deploy/preview/compose.yaml logs --no-color --tail=200 worker
            exit 1
          fi

      - name: Preview stack summary
        shell: bash
        run: |
          {
            echo "## PetAccess Public Preview stack"
            echo
            echo "- Docker image: built from infra/deploy/preview/Dockerfile"
            echo "- Compose: rendered successfully"
            echo "- PostGIS / Redis / S3-compatible storage: started"
            echo "- API migrations: applied"
            echo "- /health: PASS"
            echo "- /health/ready: PASS"
            echo "- /api/v1/ping: PASS"
            echo "- /health/components: PASS (Postgres / Redis / MinIO / Celery all_ok)"
            echo "- Celery worker: running"
            echo "- Public DNS/TLS: not claimed by this CI; still requires a real host/domain"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose -f infra/deploy/preview/compose.yaml ps || true
          docker compose -f infra/deploy/preview/compose.yaml logs --no-color --tail=250 || true

      - name: Tear down
        if: always()
        shell: bash
        run: |
          docker compose -f infra/deploy/preview/compose.yaml down -v --remove-orphans || true
