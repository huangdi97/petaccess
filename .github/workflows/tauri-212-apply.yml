name: Apply Tauri 2.12 Android Exit Fix

on:
  push:
    branches:
      - feat/ui-direct-craft-v8
    paths:
      - ".github/workflows/tauri-212-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-direct-craft-v8
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pin Tauri 2.12.3 and regenerate Cargo.lock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/client-h5/src-tauri/Cargo.toml")
          text = path.read_text(encoding="utf-8")
          old = 'tauri = { version = "2.11.6", features = [] }'
          new = 'tauri = { version = "2.12.3", features = [] }'
          if old not in text:
              raise SystemExit("expected Tauri 2.11.6 dependency not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          cargo update             --manifest-path apps/client-h5/src-tauri/Cargo.toml             -p tauri             --precise 2.12.3

          cargo metadata             --manifest-path apps/client-h5/src-tauri/Cargo.toml             --locked             --format-version 1             --no-deps >/dev/null

      - name: Verify resolved Android-exit-capable Tauri
        shell: bash
        run: |
          awk '
            /^name = "tauri"$/ { p=1; print; next }
            p && /^version = / { print; if ($0 !~ /2\.12\.3/) exit 42; p=0 }
          ' apps/client-h5/src-tauri/Cargo.lock

      - name: Commit regenerated Cargo lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client-h5/src-tauri/Cargo.toml apps/client-h5/src-tauri/Cargo.lock
          git diff --cached --quiet && {
            echo "No Tauri lock changes."
            exit 0
          }
          git commit -m "fix(android): upgrade Tauri core for activity finish"
          git push origin HEAD:feat/ui-direct-craft-v8
