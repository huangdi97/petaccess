<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-label="城市公园与携宠散步的抽象场景插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F8EED8"/>
      <stop offset="0.5" stop-color="#F1E8D2"/>
      <stop offset="0.78" stop-color="#E6E7D4"/>
      <stop offset="1" stop-color="#DCE4D4"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#C2CDBD"/>
      <stop offset="1" stop-color="#CBD5C5"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#93A895"/>
      <stop offset="1" stop-color="#A8BA9F"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0.15" y2="1">
      <stop stop-color="#7F9874"/>
      <stop offset="1" stop-color="#5A7A5B"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0.1">
      <stop stop-color="#F3EAD6"/>
      <stop offset="1" stop-color="#E3D8C0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#F9D79F" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#F7D3A0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F7D3A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2A2419" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#2A2419" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A2419" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1190" cy="220" r="270" fill="url(#sunGlow)"/>
  <circle cx="1190" cy="220" r="86" fill="#F8D9A5"/>

  <!-- distant skyline -->
  <g fill="url(#far)">
    <rect x="80" y="410" width="86" height="190" rx="4"/>
    <rect x="178" y="366" width="54" height="234" rx="4"/>
    <rect x="246" y="438" width="104" height="162" rx="4"/>
    <rect x="364" y="392" width="66" height="208" rx="4"/>
    <rect x="444" y="330" width="48" height="270" rx="4"/>
    <rect x="506" y="420" width="112" height="180" rx="4"/>
    <rect x="632" y="378" width="60" height="222" rx="4"/>
    <rect x="706" y="442" width="92" height="158" rx="4"/>
    <rect x="812" y="396" width="56" height="204" rx="4"/>
    <rect x="882" y="348" width="70" height="252" rx="4"/>
    <rect x="966" y="424" width="120" height="176" rx="4"/>
    <rect x="1100" y="386" width="58" height="214" rx="4"/>
    <rect x="1172" y="440" width="96" height="160" rx="4"/>
