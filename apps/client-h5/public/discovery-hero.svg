    <path d="M868 656c-4 11-9 20-16 27l7 7c11-9 18-20 22-31z"/>
    <path d="M888 656c4 11 9 20 16 27l-7 7c-11-9-18-20-22-31z"/>
    <path d="M896 624c26 6 48 4 70-6" stroke="#233629" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="986" cy="640" rx="33" ry="16"/>
    <circle cx="1020" cy="626" r="13"/>
    <path d="M1030 616l13-9 6 11-11 8z"/>
    <path d="M958 650l-4 21h8l6-19z"/>
    <path d="M982 652l-2 21h8l4-19z"/>
    <path d="M1002 652l2 21h8l-2-19z"/>
    <path d="M952 634c-11-2-21-9-28-18 11 4 22 7 31 11z"/>
  </g>

  <!-- birds -->
  <g stroke="#7C8B78" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M1040 300c8-8 14-8 22 0"/>
    <path d="M1084 278c10-10 18-10 28 0"/>
    <path d="M984 330c7-7 13-7 20 0"/>
