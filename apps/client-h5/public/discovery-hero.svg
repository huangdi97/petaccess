    <rect x="898" y="370" width="8" height="12" rx="1"/>
    <rect x="914" y="370" width="8" height="12" rx="1"/>
    <rect x="898" y="394" width="8" height="12" rx="1"/>
    <rect x="914" y="394" width="8" height="12" rx="1"/>
    <rect x="1298" y="424" width="8" height="12" rx="1"/>
    <rect x="1314" y="424" width="8" height="12" rx="1"/>
    <rect x="1298" y="448" width="8" height="12" rx="1"/>
    <rect x="1314" y="448" width="8" height="12" rx="1"/>
  </g>

  <!-- midground buildings -->
  <g fill="url(#mid)">
    <rect x="-10" y="520" width="150" height="150" rx="6"/>
    <rect x="164" y="496" width="102" height="174" rx="6"/>
    <rect x="288" y="536" width="146" height="134" rx="6"/>
    <rect x="456" y="500" width="86" height="170" rx="6"/>
    <rect x="562" y="548" width="180" height="122" rx="6"/>
    <rect x="762" y="512" width="98" height="158" rx="6"/>
    <rect x="880" y="544" width="156" height="126" rx="6"/>
    <rect x="1058" y="506" width="94" height="164" rx="6"/>
    <rect x="1172" y="548" width="170" height="122" rx="6"/>
    <rect x="1362" y="516" width="106" height="154" rx="6"/>
    <rect x="1488" y="548" width="122" height="122" rx="6"/>
  </g>

  <!-- lawn / path -->
  <rect x="0" y="632" width="1600" height="268" fill="url(#lawn)"/>
  <path d="M-20 738c250-34 470-16 690 18s440 44 690 12 260-26 260-26v70c-140 4-260 16-390 38s-340 26-570-6-430-50-680 0z" fill="url(#path)"/>
  <path d="M-40 842c260-28 520-26 780 6s520 26 900-14v86H-40z" fill="#597757" opacity="0.9"/>

  <!-- trees -->
  <g>
    <rect x="126" y="600" width="12" height="86" rx="6" fill="#6E5E46"/>
    <circle cx="132" cy="560" r="58" fill="#4F7050"/>
