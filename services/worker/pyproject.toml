[project]
name = "petaccess-worker"
version = "0.1.0"
description = "Celery worker entrypoint for Place Animal Access Map"
requires-python = ">=3.11"
dependencies = ["petaccess-api"]

[tool.uv.sources]
petaccess-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
