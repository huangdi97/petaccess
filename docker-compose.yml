name: petaccess

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petaccess}
      POSTGRES_USER: ${POSTGRES_USER:-petaccess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petaccess_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - petaccess_pg:/var/lib/postgresql/data
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petaccess} -d ${POSTGRES_DB:-petaccess}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - petaccess_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - petaccess_minio:/data

volumes:
  petaccess_pg:
  petaccess_redis:
  petaccess_minio:
