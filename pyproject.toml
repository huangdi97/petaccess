[project]
name = "petaccess-monorepo"
version = "0.1.0"
description = "Place Animal Access Map - Python workspace root"
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4.26.0",
    "hypothesis>=6.168.0",
]

[tool.uv.workspace]
members = ["services/api", "services/worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", ".venv", "dist", "unpackage"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.ruff.lint.per-file-ignores]
# tests build function-kwargs dicts and assert domain exceptions raise
"tests/**" = ["C408", "B017"]
# alembic autogenerate emits long single-line column definitions
"services/api/migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["node_modules", "dist", "migrations/versions", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
