[project]
name = "petaccess-monorepo"
version = "0.1.0"
description = "Place Animal Access Map - Python workspace root"
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4.26.0",
    "hypothesis>=6.168.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4",
]

[tool.uv.workspace]
members = ["services/api", "services/worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", ".venv", "dist", "unpackage"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.ruff.lint.per-file-ignores]
# tests build function-kwargs dicts and assert domain exceptions raise
"tests/**" = ["C408", "B017"]
# alembic autogenerate emits long single-line column definitions
"services/api/migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["node_modules", "dist", "migrations/versions", ".venv"]

[tool.coverage.run]
# Branch coverage, not just line: the governance invariants live in branches
# (`if layer == LEGAL`, `if needs_verification`, ...) and line coverage alone
# reports them green while the negative path is untested.
branch = true
source = ["services/api/app", "services/worker", "scripts"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "scripts/*_r1.py",
  "scripts/*_r2.py",
  "scripts/gen_*",
  "scripts/probe_*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
asyncio_mode = "auto"
# `scripts/` holds shared tooling the tests assert on (e.g. the sign-off decision
# vocabulary); make it importable rather than duplicating the constants in tests.
pythonpath = ["scripts"]
# Registered so a typo in a marker is an error rather than a silent no-op.
markers = [
    "integration: needs a real (TEST-role) database connection",
    "e2e: needs a running API server",
]
filterwarnings = ["ignore::DeprecationWarning"]
# Hard per-test ceiling. Without it a missing Celery worker turns 4 media/e2e
# cases into a multi-minute hang that looks like a dead suite; with it they fail
# fast with a stack dump. The slowest healthy case is ~13s (Hypothesis).
timeout = 120
timeout_method = "thread"
